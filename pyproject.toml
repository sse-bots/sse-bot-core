[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-bot-core"
version = "0.1.0"
description = "Shared runtime modules for SSE Discord bots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "discord.py>=2.3.0",
    "pymongo[srv]>=4.5.0",
    "aiohttp>=3.9,<4",
    "Flask>=2.3",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["sse_bot_core"]
